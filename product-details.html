<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KÍKÉLÁRÁ — Product Details</title>

  <!-- Shared -->
  <link rel="stylesheet" href="header.css" />
  <link rel="stylesheet" href="footer.css" />

  <!-- Page -->
  <link rel="stylesheet" href="product-details.css" />

  <!-- ✅ config first -->
  <script src="config.js"></script>
</head>

<body>
  <!-- Liquid motion background -->
  <div class="liquid-bg" aria-hidden="true">
    <span class="orb o1"></span>
    <span class="orb o2"></span>
    <span class="orb o3"></span>
    <span class="grain"></span>
  </div>

  <noscript>
    <h2 style="padding:20px;font-family:system-ui">JavaScript is disabled</h2>
    <p style="padding:0 20px;font-family:system-ui">Please enable JavaScript to view product details and reviews.</p>
  </noscript>

  <!-- HEADER INJECT MOUNT -->
  <div id="siteHeader"></div>

  <!-- MAIN -->
  <main class="pd" aria-label="Product details page">
    <a class="pd-back glass" href="products.html" aria-label="Back to products">← Back to products</a>

    <!-- PRODUCT -->
    <section class="pd-grid" aria-label="Product details">
      <!-- LEFT -->
      <div class="pd-left glass">
        <div class="pd-image-wrap" id="tiltMain">
          <img id="productImage" alt="Product image" loading="eager" />
        </div>

        <div id="productThumbs" class="pd-thumbs" aria-label="Product thumbnails"></div>
      </div>

      <!-- RIGHT -->
      <div class="pd-right glass">
        <div id="productCategory" class="pd-category"></div>
        <h1 id="productName" class="pd-title"></h1>

        <div class="pd-price-row">
          <div id="productPrice" class="pd-price"></div>
        </div>

        <p id="productDescription" class="pd-desc"></p>

        <div class="pd-actions">
          <button id="cartBtn" class="pd-cart-btn" type="button">ADD TO CART</button>
          <span id="productInCart" class="pd-in-cart" style="display:none;">IN CART</span>
          <a id="viewCartLink" class="pd-view-cart" href="cart.html" style="display:none;">View Cart</a>
        </div>

        <div class="pd-note">
          <span>Tip</span> Tap the image to switch views. Reviews help others choose better.
        </div>
      </div>
    </section>

    <!-- REVIEWS -->
    <section class="reviews glass" aria-label="Product reviews">
      <!-- Summary top row -->
      <div class="rv-top">
        <div class="rv-summary">
          <div class="rv-score-line">
            <span class="rv-avg" id="rvAvg">0.0</span>
            <span class="rv-stars" id="rvAvgStars"></span>
          </div>
          <div class="rv-count" id="rvCount">0 ratings</div>
        </div>


      <!-- Breakdown -->
      <div id="rvBreakdown" class="rv-breakdown" aria-label="Ratings breakdown"></div>

      <!-- Filters -->
      <div id="rvStarFilters" class="rv-filters" aria-label="Review filters">
        <button class="rv-filter is-active" data-star="0" type="button">All</button>
        <button class="rv-filter" data-star="5" type="button">5★</button>
        <button class="rv-filter" data-star="4" type="button">4★</button>
        <button class="rv-filter" data-star="3" type="button">3★</button>
        <button class="rv-filter" data-star="2" type="button">2★</button>
        <button class="rv-filter" data-star="1" type="button">1★</button>
      </div>

      <!-- Sort -->
      <div class="rv-sort-row">
        <label class="rv-sort-label" for="rvSort">Sort</label>
        <select id="rvSort" class="rv-sort">
          <option value="recent">Most recent</option>
          <option value="helpful">Most helpful</option>
          <option value="high">Highest rating</option>
          <option value="low">Lowest rating</option>
        </select>
      </div>

      <!-- List -->
      <div id="reviewsList" class="rv-list" aria-label="Reviews list"></div>

      <!-- Load more -->
      <button id="rvMoreBtn" class="rv-more" type="button">Load more</button>

      <!-- Toggle form -->
      <button id="rvToggleForm" class="rv-toggle-form" type="button">Write a review</button>

      <!-- Form -->
      <div id="rvFormWrap" class="rv-form-wrap" hidden>
        <form id="reviewForm" class="rv-form" autocomplete="off">

          <div id="starInput" class="rv-stars-input" aria-label="Select star rating">
            <button class="star" data-value="1" type="button" aria-label="1 star">★</button>
            <button class="star" data-value="2" type="button" aria-label="2 stars">★</button>
            <button class="star" data-value="3" type="button" aria-label="3 stars">★</button>
            <button class="star" data-value="4" type="button" aria-label="4 stars">★</button>
            <button class="star" data-value="5" type="button" aria-label="5 stars">★</button>
            <span id="rvHint" class="rv-hint">Select a rating</span>
          </div>

          <input id="reviewRating" type="hidden" value="0" />

          <div class="rv-fields">
            <input id="reviewName" class="rv-input" placeholder="Your name (optional)" />
            <input id="reviewTitle" class="rv-input" placeholder="Review title" required minlength="3" />
            <textarea id="reviewText" class="rv-textarea" placeholder="Write your review..." required minlength="10"></textarea>
          </div>

          <div id="reviewError" class="rv-error"></div>

          <button type="submit" class="rv-submit">Submit review</button>
        </form>
      </div>
    </section>
  </main>

  <!-- FOOTER INJECT MOUNT -->
  <div id="siteFooter"></div>

  <!-- Scripts -->
  <script src="header.js"></script>
  <script src="footer.js"></script>
  <script src="product-details.js"></script>
</body>
</html>
