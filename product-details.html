<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KÍKÉLÁRÁ — Product Details</title>

  <link rel="stylesheet" href="product-details.css" />

  <!-- ✅ MUST load config first -->
  <script src="config.js"></script>

  <!-- ✅ Defer ensures DOM exists + config already set -->
  <script defer src="product-details.js"></script>

  <noscript>
    <style>
      body { padding: 20px; font-family: system-ui, Arial, sans-serif; }
    </style>
  </noscript>
</head>
<body>
  <noscript>
    <h2>JavaScript is disabled</h2>
    <p>Please enable JavaScript to view product details and reviews.</p>
  </noscript>

  <header>
    <span id="cartCount">0</span>
    <span id="wishlistCount">0</span>
  </header>

  <main class="pd">
    <section class="pd-grid">
      <div class="pd-left">
        <img id="productImage" alt="Product" />
        <div id="productThumbs"></div>
      </div>

      <div class="pd-right">
        <div id="productCategory"></div>
        <h1 id="productName"></h1>
        <div id="productPrice"></div>

        <p id="productDescription"></p>

        <div class="pd-actions">
          <button id="cartBtn" type="button">ADD TO CART</button>
          <span id="productInCart" style="display:none;">IN CART</span>
          <a id="viewCartLink" href="cart.html" style="display:none;">View Cart</a>
        </div>
      </div>
    </section>

    <!-- REVIEWS -->
    <section class="reviews">
      <div class="rv-top">
        <div>
          <div><span id="rvAvg">0.0</span> <span id="rvAvgStars"></span></div>
          <div id="rvCount">0 ratings</div>
        </div>

        <div class="rv-admin">
          <button id="rvAdminBtn" type="button">Admin</button>
          <button id="rvAdminLogoutBtn" type="button" hidden>Logout</button>
        </div>
      </div>

      <div id="rvBreakdown"></div>

      <div id="rvStarFilters">
        <button class="rv-filter is-active" data-star="0" type="button">All</button>
        <button class="rv-filter" data-star="5" type="button">5★</button>
        <button class="rv-filter" data-star="4" type="button">4★</button>
        <button class="rv-filter" data-star="3" type="button">3★</button>
        <button class="rv-filter" data-star="2" type="button">2★</button>
        <button class="rv-filter" data-star="1" type="button">1★</button>
      </div>

      <select id="rvSort">
        <option value="recent">Most recent</option>
        <option value="helpful">Most helpful</option>
        <option value="high">Highest rating</option>
        <option value="low">Lowest rating</option>
      </select>

      <div id="reviewsList"></div>
      <button id="rvMoreBtn" type="button">Load more</button>

      <button id="rvToggleForm" type="button">Write a review</button>

      <div id="rvFormWrap" hidden>
        <form id="reviewForm">
          <div id="starInput">
            <button class="star" data-value="1" type="button">★</button>
            <button class="star" data-value="2" type="button">★</button>
            <button class="star" data-value="3" type="button">★</button>
            <button class="star" data-value="4" type="button">★</button>
            <button class="star" data-value="5" type="button">★</button>
            <span id="rvHint">Select a rating</span>
          </div>

          <input id="reviewRating" type="hidden" value="0" />

          <input id="reviewName" placeholder="Your name (optional)" />
          <input id="reviewTitle" placeholder="Review title" required />
          <textarea id="reviewText" placeholder="Write your review..." required></textarea>

          <div id="reviewError" style="color:#b00020;"></div>

          <button type="submit">Submit review</button>
        </form>
      </div>
    </section>
  </main>

  <!-- ✅ Quick debug (remove anytime) -->
  <script>
    console.log("API_BASE =", window.API_BASE);
    if (!window.API_BASE) {
      try { sessionStorage.removeItem("allProducts"); } catch {}
    }
  </script>
</body>
</html>
