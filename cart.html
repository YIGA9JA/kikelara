<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KÍKÉLÁRÁ — Cart</title>

  <meta name="description" content="Review your KÍKÉLÁRÁ cart and proceed to checkout." />

  <!-- Styles -->
  <link rel="stylesheet" href="header.css" />
  <link rel="stylesheet" href="cart.css" />
  <link rel="stylesheet" href="footer.css" />

  <!-- Config -->
  <script src="config.js"></script>

  <!-- Shared (KStore) -->
  <script defer src="store.js"></script>

  <!-- Injected header/footer -->
  <script defer src="header.js"></script>
  <script defer src="footer.js"></script>

  <!-- Page -->
  <script defer src="cart.js"></script>
</head>

<body>
  <!-- Header mount -->
  <div id="siteHeader"></div>

  <!-- ✅ Skip link target used by header.js -->
  <main id="mainContent" class="cart-page">
    <header class="cart-top">
      <h1>Your Cart</h1>
      <p class="cart-sub">Review your items and proceed to checkout.</p>
    </header>

    <section class="cart-grid" aria-label="Cart content">
      <!-- Items -->
      <div class="cart-items" id="cartItems" aria-live="polite"></div>

      <!-- Summary -->
      <aside class="cart-summary" aria-label="Order summary">
        <div class="sum-head">
          <h3>Summary</h3>
          <span class="sum-hint">Delivery at checkout</span>
        </div>

        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">₦0</span>
        </div>

        <div class="summary-row">
          <span>Delivery</span>
          <span class="sum-muted">Calculated at checkout</span>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span id="total">₦0</span>
        </div>

        <button id="checkoutBtn" class="checkout-btn" type="button" disabled>
          <span>Checkout</span>
          <span class="btn-total" id="checkoutBtnTotal">₦0</span>
        </button>

        <div class="sum-note">You’ll confirm delivery details on the next step.</div>
      </aside>
    </section>
  </main>

  <!-- ✅ Sticky Mobile Checkout -->
  <div id="mobileCheckout" class="mobile-checkout" style="display:none;">
    <button id="mobileCheckoutBtn" class="mobile-checkout-btn" type="button" disabled>
      <span>Checkout</span>
      <span id="mobileCheckoutTotal">₦0</span>
    </button>
  </div>

  <!-- Footer mount -->
  <div id="siteFooter"></div>
</body>
</html>
