<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KÍKÉLÁRÁ — Cart</title>

  <link rel="stylesheet" href="cart.css" />
  <script src="config.js"></script>
</head>
<body>

  <header>
    <span id="cartCount">0</span>
    <span id="wishlistCount">0</span>
  </header>

  <main class="cart-page">
    <h1>Your Cart</h1>

    <div id="cartItems"></div>

    <div class="summary">
      <div class="row">
        <span>Subtotal</span>
        <span id="subtotal">₦0</span>
      </div>

      <div class="row">
        <span>Delivery</span>
        <span class="muted">Calculated at checkout</span>
      </div>

      <div class="row total">
        <span>Total</span>
        <span id="total">₦0</span>
      </div>

      <button id="checkoutBtn" class="checkout-btn">
        Checkout — <span id="checkoutBtnTotal">₦0</span>
      </button>
    </div>
  </main>

  <!-- Sticky Mobile Checkout -->
  <div id="mobileCheckout" class="mobile-checkout">
    <button id="mobileCheckoutBtn">
      Checkout — <span id="mobileCheckoutTotal">₦0</span>
    </button>
  </div>

  <script src="cart.js"></script>
</body>
</html>
