<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KÍKÉLÁRÁ — Cart</title>

  <link rel="stylesheet" href="header.css" />
  <link rel="stylesheet" href="footer.css" />
  <link rel="stylesheet" href="cart.css" />

  <script src="config.js"></script>

  <!-- shared -->
  <script defer src="store.js"></script>

  <!-- injected header/footer -->
  <script defer src="header.js"></script>
  <script defer src="footer.js"></script>

  <!-- page -->
  <script defer src="cart.js"></script>
</head>

<body>
  <div id="siteHeader"></div>

  <main class="cart-page">
    <div class="cart-top">
      <h1>Your Cart</h1>
      <p class="cart-sub">Review your items and proceed to checkout.</p>
    </div>

    <section class="cart-grid">
      <div class="cart-items" id="cartItems"></div>

      <aside class="cart-summary">
        <div class="sum-head">
          <h3>Summary</h3>
          <span class="sum-hint">Delivery at checkout</span>
        </div>

        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">₦0</span>
        </div>

        <div class="summary-row">
          <span>Delivery</span>
          <span class="sum-muted">Calculated at checkout</span>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span id="total">₦0</span>
        </div>

        <button id="checkoutBtn" class="checkout-btn" type="button">
          <span>Checkout</span>
          <span class="btn-total" id="checkoutBtnTotal">₦0</span>
        </button>

        <div class="sum-note">You’ll confirm delivery details on the next step.</div>
      </aside>
    </section>
  </main>

  <!-- Sticky Mobile Checkout -->
  <div id="mobileCheckout" class="mobile-checkout" style="display:none;">
    <button id="mobileCheckoutBtn" class="mobile-checkout-btn" type="button">
      <span>Checkout</span>
      <span id="mobileCheckoutTotal">₦0</span>
    </button>
  </div>

  <div id="siteFooter"></div>
</body>
</html>
