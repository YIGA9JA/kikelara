<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KÍKÉLÁRÁ — Cart</title>

  <link rel="stylesheet" href="header.css" />
  <link rel="stylesheet" href="cart.css" />
  <link rel="stylesheet" href="footer.css" />

  <script src="config.js"></script>
  <script defer src="header.js"></script>
  <script defer src="footer.js"></script>
</head>
<body>

  <div id="siteHeader"></div>

  <main id="mainContent" class="cart-page">
    <div class="cart-top">
      <h1>Your Cart</h1>
      <div class="cart-sub">Delivery is calculated at checkout.</div>
    </div>

    <section class="cart-grid">
      <div id="cartItems" class="cart-items"></div>

      <aside class="cart-summary">
        <div class="sum-head">
          <h3>Summary</h3>
          <div class="sum-hint">Secure checkout</div>
        </div>

        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">₦0</span>
        </div>

        <div class="summary-row">
          <span>Delivery</span>
          <span class="sum-muted">Calculated at checkout</span>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span id="total">₦0</span>
        </div>

        <button id="checkoutBtn" class="checkout-btn">
          Checkout — <span id="checkoutBtnTotal" class="btn-total">₦0</span>
        </button>

        <div class="sum-note">By checking out, you agree to our terms.</div>
      </aside>
    </section>
  </main>

  <div id="mobileCheckout" class="mobile-checkout">
    <button id="mobileCheckoutBtn" class="mobile-checkout-btn">
      Checkout — <span id="mobileCheckoutTotal">₦0</span>
    </button>
  </div>

  <div id="siteFooter"></div>

  <script src="cart.js"></script>
</body>
</html>
