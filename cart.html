<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KÍKÉLÁRÁ — Cart</title>

  <meta name="description" content="Review your KÍKÉLÁRÁ cart and proceed to checkout." />
  <meta name="theme-color" content="#ffefd5" />

  <!-- Styles -->
  <link rel="stylesheet" href="header.css" />
  <link rel="stylesheet" href="cart.css" />
  <link rel="stylesheet" href="footer.css" />

  <!-- Config -->
  <script src="config.js"></script>

  <!-- Shared store (KStore) -->
  <script defer src="store.js"></script>

  <!-- Injected header/footer -->
  <script defer src="header.js"></script>
  <script defer src="footer.js"></script>

  <!-- Page -->
  <script defer src="cart.js"></script>
</head>

<body class="liquid-glass">
  <!-- Liquid background -->
  <div class="liquid-bg" aria-hidden="true">
    <span class="orb o1"></span>
    <span class="orb o2"></span>
    <span class="orb o3"></span>
    <span class="grain"></span>
  </div>

  <!-- Header mount -->
  <div id="siteHeader"></div>

  <main id="mainContent" class="cart-page">
    <header class="cart-top">
      <div class="cart-top-row">
        <div>
          <h1>Your Cart</h1>
          <p class="cart-sub">
            <span id="cartCountText">0 items</span> • Review your items and proceed to checkout.
          </p>
        </div>

        <div class="cart-top-actions">
          <a class="top-link" href="products.html">Continue shopping</a>
          <button id="clearCartBtn" class="top-btn" type="button">Clear cart</button>
        </div>
      </div>
    </header>

    <section class="cart-grid" aria-label="Cart content">
      <!-- Items -->
      <div class="cart-items" id="cartItems" aria-live="polite"></div>

      <!-- Summary -->
      <aside class="cart-summary" id="cartSummary" aria-label="Order summary">
        <div class="sum-head">
          <h3>Summary</h3>
          <span class="sum-hint">Delivery at checkout</span>
        </div>

        <div class="summary-row">
          <span>Items</span>
          <span id="itemsCount">0</span>
        </div>

        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">₦0</span>
        </div>

        <div class="summary-row">
          <span>Delivery</span>
          <span class="sum-muted">Calculated at checkout</span>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span id="total">₦0</span>
        </div>

        <button id="checkoutBtn" class="checkout-btn" type="button" disabled>
          <span>Checkout</span>
          <span class="btn-total" id="checkoutBtnTotal">₦0</span>
        </button>

        <div class="sum-note">
          Secure checkout • You’ll confirm delivery details on the next step.
        </div>
      </aside>
    </section>
  </main>

  <!-- Sticky Mobile Checkout -->
  <div id="mobileCheckout" class="mobile-checkout" aria-hidden="true">
    <button id="mobileCheckoutBtn" class="mobile-checkout-btn" type="button" disabled>
      <span class="mcb-left">
        <span class="mcb-title">Checkout</span>
        <span class="mcb-sub" id="mobileItemsText">0 items</span>
      </span>
      <span id="mobileCheckoutTotal">₦0</span>
    </button>
  </div>

  <!-- Toast host -->
  <div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="true"></div>

  <!-- Footer mount -->
  <div id="siteFooter"></div>
</body>
</html>
