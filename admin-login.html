<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KÍKÉLÁRÁ — Admin Login</title>

  <script src="config.js"></script>
  <script src="auth.js"></script>

  <style>
    :root{
      --bg:#fff4da;
      --line:rgba(43,29,18,.12);
      --text:#2b1d12;
      --muted:rgba(43,29,18,.64);
      --brand:#EDCC9F;
      --brand2:#d9b07c;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      background: radial-gradient(1200px 600px at 20% -10%, rgba(237,204,159,.40), transparent 60%),
                  radial-gradient(900px 500px at 100% 0%, rgba(217,176,124,.25), transparent 60%),
                  var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      padding:18px;
    }
    .card{
      width:min(460px,100%);
      background:rgba(255,255,255,.92);
      border:1px solid var(--line);
      border-radius:20px;
      box-shadow:0 22px 60px rgba(0,0,0,.10);
      padding:18px;
    }
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
    .logo{width:46px;height:46px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff;}
    .logo img{width:100%;height:100%;object-fit:cover;display:block}
    .title{font-weight:950;letter-spacing:.02em}
    .sub{font-size:12px;color:var(--muted);margin-top:2px}
    label{display:block;font-weight:900;margin:12px 0 6px}
    input{
      width:100%;padding:12px;border-radius:16px;
      border:1px solid var(--line);background:rgba(255,255,255,.75);
      font-weight:700;
    }
    button{
      margin-top:14px;width:100%;
      border:1px solid rgba(43,29,18,.14);
      background:linear-gradient(180deg,var(--brand),var(--brand2));
      padding:12px;border-radius:16px;
      cursor:pointer;font-weight:950;
    }
    .msg{margin-top:10px;color:var(--muted);font-weight:650}
    .err{color:#b3261e}
  </style>
</head>

<body>
  <div class="card">
    <div class="brand">
      <div class="logo"><img src="images/logo.jpg" alt="KÍKÉLÁRÁ"></div>
      <div>
        <div class="title">KÍKÉLÁRÁ</div>
        <div class="sub">Admin Login</div>
      </div>
    </div>

    <form id="loginForm" autocomplete="off">
      <label for="password">Admin password</label>
      <input id="password" type="password" placeholder="Enter admin password" required />
      <button id="loginBtn" type="submit">Login</button>
      <div id="msg" class="msg"></div>
    </form>
  </div>

  <script>
    (function(){
      const form = document.getElementById("loginForm");
      const pass = document.getElementById("password");
      const btn = document.getElementById("loginBtn");
      const msg = document.getElementById("msg");

      function setMsg(text, isErr){
        msg.textContent = text || "";
        msg.classList.toggle("err", !!isErr);
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        setMsg("");
        btn.disabled = true;

        try {
          await window.adminLogin(String(pass.value || ""));
          setMsg("✅ Logged in. Redirecting…");
          location.href = "admin-products.html";
        } catch (err) {
          setMsg(String(err.message || err), true);
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
