<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KÍKÉLÁRÁ — Admin Login</title>

  <!-- MUST define window.API_BASE in config.js -->
  <script src="config.js"></script>

  <!-- auth wrapper (cookie + csrf) -->
  <script src="auth.js"></script>

  <link rel="stylesheet" href="admin-login.css" />
</head>

<body>
  <main class="login-wrap">
    <section class="login-card" aria-label="Admin Login">
      <div class="brand">
        <div class="brand-logo">
          <img src="images/logo.jpg" alt="KÍKÉLÁRÁ" />
        </div>
        <div class="brand-meta">
          <div class="brand-name">KÍKÉLÁRÁ</div>
          <div class="brand-sub">Admin Login</div>
        </div>
      </div>

      <h1 class="headline">Welcome back</h1>
      <p class="hint">
        Enter your admin password to continue.
      </p>

      <form id="loginForm" autocomplete="off" novalidate>
        <div class="field">
          <label for="password">Admin password</label>

          <div class="input-row">
            <input
              id="password"
              type="password"
              placeholder="Enter admin password"
              required
              autocomplete="current-password"
            />
            <button id="togglePass" class="icon-btn" type="button" aria-label="Show password" title="Show password">
              👁
            </button>
          </div>
        </div>

        <!-- Optional OTP (hidden by default). If you later implement TOTP, just remove the hidden attr. -->
        <div class="field" id="otpWrap" hidden>
          <label for="otp">OTP (optional)</label>
          <input id="otp" type="text" inputmode="numeric" placeholder="123456" autocomplete="one-time-code" />
        </div>

        <div id="msg" class="msg" aria-live="polite"></div>

        <button id="loginBtn" class="btn" type="submit">Login</button>

        <div class="foot">
          <span class="muted">API:</span> <span id="apiBaseText" class="mono">—</span>
        </div>
      </form>
    </section>
  </main>

  <script>
    (function () {
      const form = document.getElementById("loginForm");
      const pass = document.getElementById("password");
      const otp = document.getElementById("otp");
      const otpWrap = document.getElementById("otpWrap");
      const btn = document.getElementById("loginBtn");
      const msg = document.getElementById("msg");
      const apiBaseText = document.getElementById("apiBaseText");
      const togglePass = document.getElementById("togglePass");

      const API_BASE = String(window.API_BASE || "").replace(/\/+$/, "");
      if (apiBaseText) apiBaseText.textContent = API_BASE || "—";

      function setMsg(text, isErr) {
        msg.textContent = text || "";
        msg.classList.toggle("err", !!isErr);
      }

      function getNextUrl() {
        try {
          const u = new URL(location.href);
          const next = u.searchParams.get("next");
          return next || "admin-dashboard.html";
        } catch {
          return "admin-dashboard.html";
        }
      }

      // If already logged in, go straight to next/dashboard
      (async function boot() {
        try {
          pass.focus();
          const ok = await window.checkAuth();
          if (ok) location.href = getNextUrl();
        } catch {
          // checkAuth already shows a blocker for network/CORS errors
        }
      })();

      togglePass?.addEventListener("click", () => {
        const isPwd = pass.type === "password";
        pass.type = isPwd ? "text" : "password";
        togglePass.textContent = isPwd ? "🙈" : "👁";
        togglePass.setAttribute("aria-label", isPwd ? "Hide password" : "Show password");
        pass.focus();
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        setMsg("", false);

        const password = String(pass.value || "").trim();
        if (!password) {
          setMsg("Password is required.", true);
          pass.focus();
          return;
        }

        btn.disabled = true;
        btn.textContent = "Logging in…";

        try {
          // If you later enable OTP on backend, just unhide otpWrap and pass otp.value
          const otpVal = otpWrap && !otpWrap.hidden ? String(otp.value || "").trim() : undefined;

          await window.adminLogin(password, otpVal);

          setMsg("✅ Logged in. Redirecting…", false);
          location.href = getNextUrl();
        } catch (err) {
          const m = String(err?.message || err || "Login failed");
          // Helpful hint for common failures
          if (/failed to fetch|networkerror/i.test(m)) {
            setMsg("Network/CORS error: backend not reachable from this page. Check HTTPS + CORS + cookies.", true);
          } else {
            setMsg(m, true);
          }
        } finally {
          btn.disabled = false;
          btn.textContent = "Login";
        }
      });
    })();
  </script>
</body>
</html>
