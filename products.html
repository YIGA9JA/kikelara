<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KÍKÉLÁRÁ — Products</title>

  <!-- Shared -->
  <link rel="stylesheet" href="header.css" />
  <link rel="stylesheet" href="footer.css" />

  <!-- Page -->
  <link rel="stylesheet" href="products.css" />

  <!-- ✅ config first -->
  <script src="config.js"></script>
</head>

<body>
  <!-- Liquid motion background -->
  <div class="liquid-bg" aria-hidden="true">
    <span class="orb o1"></span>
    <span class="orb o2"></span>
    <span class="orb o3"></span>
    <span class="grain"></span>
  </div>

  <!-- HEADER INJECT MOUNT -->
  <div id="siteHeader"></div>

  <!-- MAIN -->
  <main class="pd" aria-label="Products page">
    <section class="pd-top glass">
      <div class="pd-top-left">
        <h1 class="pd-title">Products</h1>
        <div id="productsMeta" class="pd-meta" aria-live="polite"></div>
      </div>

      <div class="filters" aria-label="Product filters">
        <label class="sr-only" for="categorySelect">Category</label>
        <select id="categorySelect">
          <option value="all">All</option>
        </select>

        <label class="sr-only" for="sortSelect">Sort</label>
        <select id="sortSelect">
          <option value="default">Default</option>
          <option value="priceLow">Price: Low → High</option>
          <option value="priceHigh">Price: High → Low</option>
          <option value="name">Name A → Z</option>
        </select>
      </div>
    </section>

    <!-- Grid -->
    <section class="pd-grid-wrap">
      <div id="productsGrid" class="products-grid" aria-label="Products list"></div>

      <div id="emptyState" class="empty glass" hidden>
        <h3>We couldn’t load products</h3>
        <p>Please check your connection and try again.</p>
        <button class="retry" id="retryBtn" type="button">Retry</button>
      </div>
    </section>
  </main>

  <!-- FOOTER INJECT MOUNT -->
  <div id="siteFooter"></div>

  <!-- Scripts -->
  <script src="header.js"></script>
  <script src="footer.js"></script>
  <script src="products.js"></script>
</body>
</html>
