<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KÍKÉLÁRÁ — Products Admin</title>

  <script src="config.js"></script>
  <link rel="stylesheet" href="admin-products.css" />
</head>
<body>

  <noscript>
    <div style="padding:16px; background:#fff4da; color:#2b2215; font-weight:700;">
      This admin page requires JavaScript to work.
    </div>
  </noscript>

  <main class="ad">
    <header class="ad-top">
      <div class="ad-brand">
        <div class="ad-logo">
          <img src="images/logo.jpg" alt="KÍKÉLÁRÁ" />
        </div>
        <div>
          <div class="ad-title">KÍKÉLÁRÁ</div>
          <div class="ad-sub">Products Admin</div>
        </div>
      </div>

      <div class="ad-actions">
        <button class="ad-btn" id="refreshBtn" type="button">Refresh</button>
        <button class="ad-btn" id="newBtn" type="button">Add Product</button>
      </div>
    </header>

    <section class="ad-card">
      <div class="ad-controls">
        <div class="ad-search">
          <input id="q" type="text" placeholder="Search name, price, description…" autocomplete="off" />
        </div>

        <div class="ad-filters">
          <button class="ad-pill is-active" type="button" data-filter="all">All</button>
          <button class="ad-pill" type="button" data-filter="active">Active</button>
          <button class="ad-pill" type="button" data-filter="inactive">Inactive</button>
        </div>

        <div class="ad-sort">
          <select id="sort">
            <option value="new">Newest</option>
            <option value="old">Oldest</option>
            <option value="name">Name (A–Z)</option>
            <option value="priceHigh">Price (High)</option>
            <option value="priceLow">Price (Low)</option>
          </select>
        </div>
      </div>

      <div class="ad-status" id="status" aria-live="polite"></div>

      <div class="ad-grid" id="grid"></div>

      <div class="ad-empty" id="empty" style="display:none;">
        No products found.
      </div>
    </section>
  </main>

  <div class="toast-wrap" id="toastWrap" aria-live="polite" aria-relevant="additions"></div>

  <!-- Create/Edit Modal (kept) -->
  <div class="modal" id="editModal" aria-hidden="true" inert>
    <div class="modal-card modal-wide">
      <div class="modal-top">
        <div class="modal-title" id="editTitle">Add Product</div>
        <button class="modal-x" id="editClose" aria-label="Close" type="button">×</button>
      </div>

      <form id="editForm" novalidate>
        <input type="hidden" id="pid" />
        <input type="hidden" id="removeImage" value="false" />

        <div class="form-grid">
          <div>
            <label class="lbl" for="name">Name</label>
            <input class="ipt" id="name" type="text" placeholder="Product name" required />
          </div>

          <div>
            <label class="lbl" for="price">Price (₦)</label>
            <input class="ipt" id="price" type="number" min="0" step="1" placeholder="0" required inputmode="numeric" />
          </div>

          <div class="span2">
            <div class="lblRow">
              <label class="lbl" for="desc" style="margin:0;">Description</label>
              <div class="count" id="descCount">0 / 600</div>
            </div>
            <textarea class="txt" id="desc" rows="4" placeholder="Short product description… (max 600 chars)"></textarea>
          </div>

          <div>
            <label class="lbl">Visibility</label>

            <div class="seg" role="group" aria-label="Visibility">
              <button class="segBtn is-on" type="button" data-seg="true">Active</button>
              <button class="segBtn" type="button" data-seg="false">Hidden</button>
            </div>

            <select class="ipt" id="active" style="display:none;">
              <option value="true">Yes (Active)</option>
              <option value="false">No (Hidden)</option>
            </select>

            <div class="preview-hint" style="margin-top:8px;">
              Active = visible on website • Hidden = not visible
            </div>
          </div>

          <div>
            <label class="lbl" for="image">Image</label>
            <input class="ipt" id="image" type="file" accept="image/png,image/jpeg,ima
