<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KÍKÉLÁRÁ — Products Admin</title>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <link rel="stylesheet" href="admin-products.css" />
</head>

<body>
  <noscript>
    <div class="noscript">This admin page requires JavaScript to work.</div>
  </noscript>

  <main class="ad">
    <header class="ad-top">
      <div class="ad-brand">
        <div class="ad-logo">
          <img src="images/logo.jpg" alt="KÍKÉLÁRÁ" />
        </div>
        <div>
          <div class="ad-title">KÍKÉLÁRÁ</div>
          <div class="ad-sub">Products Admin</div>
          <div class="ad-pill" id="apiPill">API: —</div>
        </div>
      </div>

      <div class="ad-actions">
        <a class="ad-btn ghost" href="admin-dashboard.html">Dashboard</a>
        <button class="ad-btn" id="refreshBtn" type="button">Refresh</button>
        <button class="ad-btn primary" id="newBtn" type="button">Add Product</button>
        <button class="ad-btn danger" id="logoutBtn" type="button">Logout</button>
      </div>
    </header>

    <section class="ad-controls">
      <div class="ad-search">
        <input id="q" type="search" placeholder="Search name, price, description…" autocomplete="off" />
        <button id="clearSearchBtn" class="ad-iconbtn" type="button" aria-label="Clear search">✕</button>
      </div>

      <div class="ad-right">
        <select id="sort" class="ad-select" aria-label="Sort">
          <option value="new" selected>Newest</option>
          <option value="old">Oldest</option>
          <option value="name">Name</option>
          <option value="priceHigh">Price: High → Low</option>
          <option value="priceLow">Price: Low → High</option>
        </select>

        <div class="ad-filters" role="tablist" aria-label="Filter">
          <button class="ad-filter is-active" data-filter="all" aria-selected="true" type="button">All</button>
          <button class="ad-filter" data-filter="active" aria-selected="false" type="button">Active</button>
          <button class="ad-filter" data-filter="inactive" aria-selected="false" type="button">Hidden</button>
        </div>
      </div>
    </section>

    <div class="ad-status" id="status" data-type="info">Loading…</div>

    <section class="ad-grid" id="grid" aria-live="polite"></section>

    <section class="ad-empty" id="empty" style="display:none;">
      <div class="ad-empty-card">
        <div class="ad-empty-title">No products found</div>
        <div class="ad-empty-sub">Add your first product or clear filters.</div>
        <button class="ad-btn primary" id="emptyAddBtn" type="button">Add Product</button>
      </div>
    </section>
  </main>

  <!-- Toasts -->
  <div class="toastWrap" id="toastWrap" aria-live="polite" aria-atomic="true"></div>

  <!-- Modal -->
  <div class="modal" id="editModal" aria-hidden="true" inert>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="modal-head">
        <div class="modal-title" id="editTitle">Add Product</div>
        <button class="modal-x" id="editClose" type="button" aria-label="Close">✕</button>
      </div>

      <form id="editForm" class="modal-body" autocomplete="off">
        <input id="pid" type="hidden" />
        <input id="removeImage" type="hidden" value="false" />

        <div class="form-row">
          <label class="lbl" for="name">Product name</label>
          <input class="ipt" id="name" placeholder="e.g. Baby Body Butter" required />
        </div>

        <div class="form-2">
          <div class="form-row">
            <label class="lbl" for="price">Price (₦)</label>
            <input class="ipt" id="price" type="number" min="0" step="1" placeholder="10000" required />
          </div>

          <div class="form-row">
            <label class="lbl">Active</label>
            <input id="active" type="hidden" value="true" />
            <div class="seg">
              <button class="segBtn is-on" type="button" data-seg="true">Active</button>
              <button class="segBtn" type="button" data-seg="false">Hidden</button>
            </div>
          </div>
        </div>

        <div class="form-row">
          <label class="lbl" for="desc">Description</label>
          <textarea class="ipt ta" id="desc" rows="4" placeholder="Short description…"></textarea>
          <div class="count" id="descCount">0 / 600</div>
        </div>

        <div class="form-row">
          <label class="lbl">Image (PNG/JPG/WEBP, max 8MB)</label>

          <div class="dropBox" id="dropBox" tabindex="0" role="button" aria-label="Choose product image">
            <!-- ✅ REAL clickable overlay input -->
            <input
              id="image"
              type="file"
              accept="image/png,image/jpeg,image/webp"
              class="fileOverlay"
            />

            <div class="dropOverlay" id="imgDropOverlay">
              <div class="dropTitle">Click to choose image</div>
              <div class="dropSub">or drag & drop here</div>
            </div>

            <img id="previewImg" alt="Preview" draggable="false" />
          </div>

          <div class="imgActions">
            <button class="ad-btn ghost" id="clearImgBtn" type="button">Remove image</button>
          </div>
        </div>

        <div class="help" id="editHelp"></div>

        <div class="modal-actions">
          <button class="ad-btn ghost" id="cancelEdit" type="button">Cancel</button>
          <button class="ad-btn primary" id="saveBtn" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin-products.js"></script>
</body>
</html>
