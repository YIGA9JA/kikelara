<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KÍKÉLÁRÁ — Products Admin</title>

  <!-- MUST set window.API_BASE in config.js -->
  <script src="config.js"></script>
  <script src="auth.js"></script>

  <link rel="stylesheet" href="admin-products.css" />
  <meta name="robots" content="noindex,nofollow" />
</head>
<body>

  <header class="ad-top">
    <div class="ad-brand">
      <div class="ad-logo">
        <img src="images/logo.jpg" alt="KÍKÉLÁRÁ" />
      </div>
      <div class="ad-brand-txt">
        <div class="ad-title">KÍKÉLÁRÁ</div>
        <div class="ad-sub">Products Admin</div>
      </div>
    </div>

    <div class="ad-actions">
      <a class="ad-btn ghost" href="admin-dashboard.html" id="dashBtn">Dashboard</a>
      <button class="ad-btn ghost" id="refreshBtn" type="button">Refresh</button>
      <button class="ad-btn" id="newBtn" type="button">Add Product</button>
      <button class="ad-btn danger" id="logoutBtn" type="button">Logout</button>
    </div>
  </header>

  <section class="ad-wrap">

    <div class="ad-bar">
      <div class="ad-left">
        <div class="pill" id="apiPill">API: —</div>
        <div class="status" id="status" data-type="info">Loading…</div>
      </div>

      <div class="ad-right">
        <div class="search">
          <input id="q" type="search" placeholder="Search name, description, price…" autocomplete="off" />
          <button class="mini" id="clearSearchBtn" type="button" title="Clear">×</button>
        </div>

        <select id="sort" class="select" aria-label="Sort">
          <option value="new">Newest</option>
          <option value="old">Oldest</option>
          <option value="name">Name</option>
          <option value="priceHigh">Price (High)</option>
          <option value="priceLow">Price (Low)</option>
        </select>
      </div>
    </div>

    <div class="filters" role="tablist" aria-label="Filter products">
      <button class="chip is-active" data-filter="all" aria-selected="true" type="button">All</button>
      <button class="chip" data-filter="active" aria-selected="false" type="button">Active</button>
      <button class="chip" data-filter="inactive" aria-selected="false" type="button">Hidden</button>
    </div>

    <div id="grid" class="grid" aria-live="polite"></div>

    <div id="empty" class="empty" style="display:none;">
      <div class="empty-card">
        <div class="empty-ico">🧴</div>
        <div class="empty-title">No products found</div>
        <div class="empty-sub">Add your first product to start selling.</div>
        <button class="ad-btn" id="emptyAddBtn" type="button">Add Product</button>
      </div>
    </div>

  </section>

  <!-- TOASTS -->
  <div class="toasts" id="toastWrap" aria-live="polite" aria-relevant="additions"></div>

  <!-- MODAL -->
  <div class="modal" id="editModal" aria-hidden="true" inert>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editTitle">

      <div class="modal-head">
        <div class="modal-title" id="editTitle">Add Product</div>
        <button class="modal-x" id="editClose" type="button" aria-label="Close">×</button>
      </div>

      <div class="modal-body">
        <div class="modal-help" id="editHelp"></div>

        <form id="editForm">
          <input type="hidden" id="pid" value="" />
          <input type="hidden" id="removeImage" value="false" />

          <div class="form-grid">

            <div class="field">
              <label for="name">Product name</label>
              <input id="name" type="text" placeholder="e.g. Baby Body Butter" required />
            </div>

            <div class="field">
              <label for="price">Price (₦)</label>
              <input id="price" type="number" min="0" step="1" placeholder="10000" required />
            </div>

            <div class="field span2">
              <label for="desc">Description</label>
              <textarea id="desc" rows="4" placeholder="Short product description…"></textarea>
              <div class="count" id="descCount">0 / 600</div>
            </div>

            <div class="field span2">
              <label>Status</label>
              <div class="seg">
                <button class="segBtn is-on" type="button" data-seg="true">Active</button>
                <button class="segBtn" type="button" data-seg="false">Hidden</button>
                <select id="active" class="srOnly" aria-hidden="true">
                  <option value="true" selected>Active</option>
                  <option value="false">Hidden</option>
                </select>
              </div>
            </div>

            <div class="field span2">
              <label>Product image</label>

              <div class="imgBox" id="dropBox">
                <!-- ✅ CLICK ALWAYS WORKS because input sits over the whole box -->
                <input
                  id="image"
                  class="fileInput"
                  type="file"
                  accept="image/png,image/jpeg,image/webp"
                />

                <img id="previewImg" class="preview" alt="Preview" style="display:none;" />

                <div class="overlay" id="imgDropOverlay">
                  <div class="ov-title">Drop image here</div>
                  <div class="ov-sub">or click to choose (PNG/JPG/WEBP • max 8MB)</div>
                </div>
              </div>

              <div class="imgActions">
                <button class="ad-btn ghost" id="clearImgBtn" type="button">Clear image</button>
              </div>
            </div>

          </div>

          <div class="modal-foot">
            <button class="ad-btn ghost" id="cancelEdit" type="button">Cancel</button>
            <button class="ad-btn" id="saveBtn" type="submit">Save</button>
          </div>

        </form>
      </div>
    </div>
  </div>

  <script src="admin-products.js"></script>
</body>
</html>
