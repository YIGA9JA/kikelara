<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>KÍKÉLÁRÁ — Products Admin</title>

  <!-- MUST define window.API_BASE in config.js -->
  <script src="config.js"></script>

  <!-- cookie auth + csrf wrapper -->
  <script src="auth.js"></script>

  <link rel="stylesheet" href="admin-products.css" />
  <script src="admin-products.js" defer></script>
</head>

<body>
  <noscript>
    <div class="nojs">
      This admin page requires JavaScript to work.
    </div>
  </noscript>

  <main class="ad">
    <!-- Top bar -->
    <header class="ad-top">
      <div class="ad-brand" role="banner" aria-label="KÍKÉLÁRÁ Admin">
        <div class="ad-logo" aria-hidden="true">
          <img src="images/logo.jpg" alt="KÍKÉLÁRÁ" />
        </div>
        <div class="ad-brandText">
          <div class="ad-title">KÍKÉLÁRÁ</div>
          <div class="ad-sub">Products Admin</div>
        </div>
      </div>

      <div class="ad-actions">
        <button class="ad-btn" id="refreshBtn" type="button">Refresh</button>
        <button class="ad-btn primary" id="newBtn" type="button">Add Product</button>
        <button class="ad-btn ghost" id="logoutBtn" type="button">Logout</button>
      </div>
    </header>

    <!-- Toolbar -->
    <section class="ad-toolbar" aria-label="Tools">
      <div class="ad-search">
        <label class="srOnly" for="q">Search products</label>
        <input id="q" type="search" placeholder="Search name, price, description…" autocomplete="off" />
        <button class="ad-iconBtn" id="clearSearchBtn" type="button" aria-label="Clear search" title="Clear">
          ✕
        </button>
      </div>

      <div class="ad-controls">
        <div class="ad-sort">
          <label class="srOnly" for="sort">Sort</label>
          <select id="sort">
            <option value="new" selected>Newest</option>
            <option value="old">Oldest</option>
            <option value="name">Name</option>
            <option value="priceHigh">Price: High → Low</option>
            <option value="priceLow">Price: Low → High</option>
          </select>
        </div>

        <div class="ad-filters" role="tablist" aria-label="Filter">
          <button type="button" class="filterBtn is-active" data-filter="all" role="tab" aria-selected="true">All</button>
          <button type="button" class="filterBtn" data-filter="active" role="tab" aria-selected="false">Active</button>
          <button type="button" class="filterBtn" data-filter="inactive" role="tab" aria-selected="false">Hidden</button>
        </div>
      </div>
    </section>

    <!-- Status -->
    <div class="ad-status" id="status" data-type="info" aria-live="polite"></div>

    <!-- Grid -->
    <section class="ad-gridWrap">
      <div id="grid" class="ad-grid" aria-label="Products"></div>

      <div id="empty" class="ad-empty" style="display:none;">
        <div class="ad-emptyCard">
          <div class="ad-emptyTitle">No products found</div>
          <div class="ad-emptySub">Try a different search or filter.</div>
          <button class="ad-btn primary" type="button" id="emptyAddBtn">Add Product</button>
        </div>
      </div>
    </section>

    <!-- Toasts -->
    <div id="toastWrap" class="toastWrap" aria-live="polite" aria-relevant="additions removals"></div>
  </main>

  <!-- Edit/Add Modal -->
  <div id="editModal" class="modal" aria-hidden="true" inert>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="modal-top">
        <div class="modal-title" id="editTitle">Add Product</div>
        <button class="ad-iconBtn" id="editClose" type="button" aria-label="Close">✕</button>
      </div>

      <div class="modal-body">
        <div id="editHelp" class="help" aria-live="polite"></div>

        <form id="editForm" class="form" autocomplete="off">
          <input id="pid" type="hidden" />

          <div class="row2">
            <div class="field">
              <label for="name">Product name</label>
              <input id="name" type="text" placeholder="e.g. Baby Body Butter" required />
            </div>

            <div class="field">
              <label for="price">Price (₦)</label>
              <input id="price" inputmode="numeric" type="number" min="0" step="1" placeholder="0" required />
            </div>
          </div>

          <div class="field">
            <label for="desc">Description</label>
            <textarea id="desc" rows="4" placeholder="Short premium description…"></textarea>
            <div class="count" id="descCount">0 / 600</div>
          </div>

          <div class="field">
            <label>Status</label>

            <!-- Hidden select still used for value, segmented buttons set it -->
            <select id="active" class="srOnly" aria-hidden="true" tabindex="-1">
              <option value="true" selected>Active</option>
              <option value="false">Hidden</option>
            </select>

            <div class="seg">
              <button type="button" class="segBtn is-on" data-seg="true">Active</button>
              <button type="button" class="segBtn" data-seg="false">Hidden</button>
            </div>
          </div>

          <div class="field">
            <label>Image</label>

            <input id="removeImage" type="hidden" value="false" />

            <div id="dropBox" class="dropBox" tabindex="0" role="button" aria-label="Drop image here or click to choose">
              <div id="imgDropOverlay" class="dropOverlay">
                <div class="dropTitle">Drop an image here</div>
                <div class="dropSub">or click to choose (PNG/JPG/WEBP, max 8MB)</div>
              </div>

              <img id="previewImg" class="previewImg" alt="Preview" draggable="false" />
            </div>

            <div class="imgActions">
              <input id="image" type="file" accept="image/png,image/jpeg,image/webp" class="fileInput" />
              <button id="clearImgBtn" class="ad-btn ghost" type="button">Clear image</button>
            </div>
          </div>

          <div class="modal-actions">
            <button class="ad-btn" id="cancelEdit" type="button">Cancel</button>
            <button class="ad-btn primary" id="saveBtn" type="submit">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
