<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KÍKÉLÁRÁ — Products Admin</title>

  <!-- Must define window.API_BASE + admin constants -->
  <script src="config.js"></script>

  <link rel="stylesheet" href="admin-products.css" />

  <!-- auth.js must load BEFORE admin-products.js -->
  <script src="auth.js" defer></script>
  <script src="admin-products.js" defer></script>
</head>
<body>

  <noscript>
    <div class="noscript">
      This admin page requires JavaScript to work.
    </div>
  </noscript>

  <main class="ad">

    <!-- TOP BAR -->
    <header class="ad-top">
      <a class="ad-brand" href="admin-dashboard.html" aria-label="Go to dashboard">
        <div class="ad-logo">
          <img src="images/logo.jpg" alt="KÍKÉLÁRÁ" />
        </div>
        <div>
          <div class="ad-title">KÍKÉLÁRÁ</div>
          <div class="ad-sub">Products Admin</div>
        </div>
      </a>

      <div class="ad-actions">
        <a class="ad-btn ghost" href="admin-dashboard.html">Dashboard</a>
        <button class="ad-btn" id="refreshBtn" type="button">Refresh</button>
        <button class="ad-btn" id="newBtn" type="button">Add Product</button>
        <button class="ad-btn danger" id="logoutBtn" type="button">Logout</button>
      </div>
    </header>

    <!-- CONTROLS -->
    <section class="ad-controls">
      <div class="ctrl-row">
        <div class="search">
          <input id="q" type="search" placeholder="Search products…" autocomplete="off" />
          <button id="clearSearchBtn" class="icon-btn" type="button" aria-label="Clear search">✕</button>
        </div>

        <select id="sort" class="select" aria-label="Sort">
          <option value="new">Newest</option>
          <option value="old">Oldest</option>
          <option value="name">Name A–Z</option>
          <option value="priceHigh">Price High → Low</option>
          <option value="priceLow">Price Low → High</option>
        </select>
      </div>

      <div class="filter-row" role="tablist" aria-label="Filter">
        <button class="pill is-active" type="button" data-filter="all" aria-selected="true">All</button>
        <button class="pill" type="button" data-filter="active" aria-selected="false">Active</button>
        <button class="pill" type="button" data-filter="inactive" aria-selected="false">Hidden</button>
      </div>

      <div id="status" class="status" data-type="info">Loading…</div>
    </section>

    <!-- GRID -->
    <section class="ad-grid" id="grid" aria-label="Products"></section>

    <!-- EMPTY -->
    <section class="empty" id="empty" style="display:none;">
      <div class="empty-card">
        <div class="empty-title">No products found</div>
        <div class="empty-sub">Try clearing search/filter or add a new product.</div>
        <button id="emptyAddBtn" class="ad-btn" type="button">Add Product</button>
      </div>
    </section>

    <!-- TOASTS -->
    <div class="toast-wrap" id="toastWrap" aria-live="polite" aria-atomic="true"></div>

    <!-- EDIT MODAL -->
    <div class="modal" id="editModal" aria-hidden="true" inert>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editTitle">

        <div class="modal-top">
          <div class="modal-title" id="editTitle">Add Product</div>
          <button class="icon-btn" id="editClose" type="button" aria-label="Close">✕</button>
        </div>

        <div class="modal-body">
          <div id="editHelp" class="help" data-type=""></div>

          <form id="editForm" class="form" autocomplete="off">
            <input type="hidden" id="pid" />
            <input type="hidden" id="removeImage" value="false" />

            <div class="two">
              <div class="field">
                <label for="name">Name</label>
                <input id="name" type="text" maxlength="200" placeholder="e.g. Baby Body Butter" required />
              </div>

              <div class="field">
                <label for="price">Price (₦)</label>
                <input id="price" type="number" min="0" step="1" placeholder="e.g. 12000" required />
              </div>
            </div>

            <div class="field">
              <div class="label-row">
                <label for="desc">Description</label>
                <div class="count" id="descCount">0 / 600</div>
              </div>
              <textarea id="desc" rows="4" maxlength="600" placeholder="Short, clear, premium description…"></textarea>
            </div>

            <!-- ACTIVE SEGMENT -->
            <div class="field">
              <label>Status</label>
              <input type="hidden" id="active" value="true" />
              <div class="seg" role="group" aria-label="Active">
                <button class="segBtn is-on" type="button" data-seg="true">Active</button>
                <button class="segBtn" type="button" data-seg="false">Hidden</button>
              </div>
            </div>

            <!-- IMAGE -->
            <div class="field">
              <label>Image</label>

              <div class="drop" id="dropBox" tabindex="0" role="button" aria-label="Choose or drop an image">
                <div class="drop-overlay" id="imgDropOverlay">
                  <div class="drop-ico">⬆</div>
                  <div class="drop-title">Drop an image here</div>
                  <div class="drop-sub">or click to upload • PNG/JPG/WEBP • max 8MB</div>
                </div>

                <img id="previewImg" class="preview" alt="Preview" style="display:none;" />

                <input id="image" class="file" type="file" accept="image/png,image/jpeg,image/webp" />
              </div>

              <div class="img-actions">
                <button class="ad-btn ghost" id="clearImgBtn" type="button">Remove image</button>
              </div>
            </div>

            <div class="form-actions">
              <button class="ad-btn ghost" id="cancelEdit" type="button">Cancel</button>
              <button class="ad-btn" id="saveBtn" type="submit">Save</button>
            </div>
          </form>

        </div>
      </div>
    </div>

  </main>

</body>
</html>
