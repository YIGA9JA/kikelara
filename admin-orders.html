<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Orders | KÍKE LÁRÁ</title>

  <link rel="stylesheet" href="admin-orders.css" />
</head>

<body>
  <header class="main-header">
    <div class="brand" aria-label="Kíke Lárá Admin">
      <img src="images/logo.jpg" alt="Kíke Lárá">
      <div class="brand-text">
        <b>KÍKE LÁRÁ Admin</b>
        <span>Orders</span>
      </div>
    </div>

    <div class="header-actions">
      <button id="refreshBtn" class="ghost-btn" type="button">Refresh</button>
      <button id="logoutBtn" class="ghost-btn" type="button">Logout</button>
    </div>
  </header>

  <main class="page">
    <section class="page-head">
      <div>
        <h1>Orders</h1>
        <p class="muted">All orders from all users (backend). Update statuses live.</p>
      </div>

      <div class="chips">
        <span class="chip">API: <b id="apiChip">—</b></span>
        <span class="chip">Auto refresh: <b id="autoChip">30s</b></span>
        <span class="chip">Last update: <b id="lastUpdate">—</b></span>
      </div>
    </section>

    <section class="controls">
      <div class="tabs" id="tabs"></div>

      <div class="search-row">
        <input id="searchBox" type="text" placeholder="Search name, phone, email, reference..." autocomplete="off" />
      </div>
    </section>

    <section id="errorBox" class="errorBox" style="display:none;"></section>

    <section id="ordersList" class="ordersList">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </section>
  </main>

  <!-- Toasts -->
  <div id="toastWrap" class="toast-wrap" aria-live="polite" aria-relevant="additions"></div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="admin-orders.js"></script>
</body>
</html>
